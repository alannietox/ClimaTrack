name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, mbstring, pdo_mysql, simplexml
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            php -l "$file"
          done < <(find . -type f -name '*.php'             -not -path './vendor/*'             -print0)

      - name: Run tests
        run: composer test

      - name: Validate project structure
        run: |
          test -f README.md
          test -f schema.sql
          test -f conexion.example.php
          test -f .env.example
          test -d iconos
